name: Film set check (Mac GPU)

on:
  workflow_dispatch:
    inputs:
      test:
        description: playperf | cover | popup | build | agent | demo | buildclip | selfcheck | walk | windup | cloudsim | webrtc | flicker | vercel-login
        required: true
        default: popup
      browser:
        description: chromium | webkit
        required: true
        default: chromium
      vercel_share:
        description: Vercel share token of the FE preview (from the PR's preview comment)
        required: false
        default: ''
      canvas_id:
        description: TapNow canvas id
        required: false
        default: ''
      set_match:
        description: popup test, text of the set to open
        required: false
        default: airport
      video_key:
        description: demo test, one-time key to encrypt the highlight video for pickup (masked; the artifact is only ciphertext)
        required: false
        default: ''
      agent_env:
        description: agent test, Agent PR preview environment name (agent_env)
        required: false
        default: ''
      new_canvas:
        description: selfcheck test, 1 = build on a new canvas made in canvas_id's team; empty = media check of canvas_id only
        required: false
        default: ''
      mode:
        description: cloudsim test, frame (runner in the canvas page) | cloud (runner in a separate browser)
        required: false
        default: frame
      open_view:
        description: cloudsim test, 1 = keep the set's opened view on screen while it builds
        required: false
        default: ''
      throttle:
        description: selfcheck test, CPU slow-down factor (1 = none)
        required: false
        default: '4'
      fe_host:
        description: FE host (default tapnow-pr-2178.cinemap.space)
        required: false
        default: ''
      cycles:
        description: flicker test, pick / click-away cycles
        required: false
        default: '6'
      cm_share:
        description: Vercel share token of the CineMap preview (so a fresh browser profile can open it)
        required: false
        default: ''
      bff_env:
        description: test BFF env (default pr-11238)
        required: false
        default: ''
      bg_test:
        description: cover test, hide the canvas tab for 45 s after the first clip claim, then reload once
        required: false
        default: ''
      channel:
        description: chromium only, a browser installed on the Mac instead of Playwright's Chromium (chrome = Google Chrome, which plays H.264)
        required: false
        default: ''
      full_trace:
        description: 1 = record Chrome traces (DevTools Performance panel files, kept on the Mac) and summarise them
        required: false
        default: ''
      opens:
        description: playperf test, how many times the popup is opened (the first with the HTTP cache cleared)
        required: false
        default: '2'
      play_seconds:
        description: playperf test, seconds of playback recorded in the popup
        required: false
        default: '12'
      sentence:
        description: build test, the sentence for the new set; agent test, what to say to the agent
        required: false
        default: A quiet bus stop at dusk with one bench and a streetlight

# Only the Mac runner registered to this repo (self-hosted, macOS, ARM64) takes these jobs.
jobs:
  check:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The repo is public: mask the preview share token and the canvas id before any step shows them. Read from the event
      # file, so the values never appear in a script line either.
      - name: Mask inputs
        run: node -e "const i=require(process.env.GITHUB_EVENT_PATH).inputs||{};for(const k of ['vercel_share','canvas_id','video_key','cm_share'])if(i[k])console.log('::add-mask::'+i[k])"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install ${{ inputs.browser }}
      - name: Run
        env:
          BROWSER: ${{ inputs.browser }}
          VERCEL_SHARE: ${{ inputs.vercel_share }}
          CANVAS_ID: ${{ inputs.canvas_id }}
          SET_MATCH: ${{ inputs.set_match }}
          SENTENCE: ${{ inputs.sentence }}
          AGENT_ENV: ${{ inputs.agent_env }}
          THROTTLE: ${{ inputs.throttle }}
          NEW_CANVAS: ${{ inputs.new_canvas }}
          MODE: ${{ inputs.mode }}
          OPEN_VIEW: ${{ inputs.open_view }}
          FE_HOST: ${{ inputs.fe_host || 'tapnow-pr-2178.cinemap.space' }}
          CYCLES: ${{ inputs.cycles }}
          CHROME_CHANNEL: ${{ inputs.channel }}
          BFF_ENV: ${{ inputs.bff_env }}
          BG_TEST: ${{ inputs.bg_test }}
          CM_SHARE: ${{ inputs.cm_share }}
          FULL_TRACE: ${{ inputs.full_trace }}
          OPENS: ${{ inputs.opens }}
          PLAY_SECONDS: ${{ inputs.play_seconds }}
          T_USER: ${{ secrets.TAPNOW_USER }}
          T_PASS: ${{ secrets.TAPNOW_PASS }}
          # Screenshots and the screen recording stay on this Mac, in ~/.film-set-e2e/results/run-<n>-<test>-<browser>
          # (public repo: nothing of the canvas is uploaded); the log prints only the numbers (result.json).
          RUN_TAG: run-${{ github.run_number }}-${{ inputs.test }}-${{ inputs.browser }}
        # caffeinate keeps the Mac's display awake: a sleeping display makes the canvas tab hidden, and hidden tabs stop rendering clips
        run: caffeinate -dis node tests/${{ inputs.test }}.mjs
      # demo only: the highlight video leaves this Mac encrypted (a one-time key passed as a masked input), kept one day
      - name: Encrypt highlight video
        if: ${{ always() && inputs.test == 'demo' && inputs.video_key != '' }}
        env:
          KEY: ${{ inputs.video_key }}
          RUN_TAG: run-${{ github.run_number }}-${{ inputs.test }}-${{ inputs.browser }}
        run: |
          f="$HOME/.film-set-e2e/results/$RUN_TAG/film-set-highlights.webm"
          test -s "$f" || { echo "no highlight video"; exit 0; }
          mkdir -p "$RUNNER_TEMP/hl" && openssl enc -aes-256-cbc -pbkdf2 -salt -in "$f" -out "$RUNNER_TEMP/hl/highlights.bin" -pass env:KEY
          ls -l "$RUNNER_TEMP/hl"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.test == 'demo' && inputs.video_key != '' }}
        with:
          name: highlights-encrypted
          path: ${{ runner.temp }}/hl/highlights.bin
          retention-days: 1
          if-no-files-found: ignore
